[workspace]
resolver = "2"
members = [
    "crates/umbrawg-crypto",
    "crates/umbrawg-proto",
    "crates/umbrawg-noise",
    "crates/umbrawg-device",
    "crates/umbrawg-transport",
    "crates/umbrawg-tun",
    "crates/umbrawg-uapi",
    "crates/umbrawg",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ivlev-dev/umbrawg-rs"

[workspace.dependencies]
umbrawg-crypto = { path = "crates/umbrawg-crypto" }
umbrawg-proto = { path = "crates/umbrawg-proto" }
umbrawg-noise = { path = "crates/umbrawg-noise" }
umbrawg-device = { path = "crates/umbrawg-device" }
umbrawg-transport = { path = "crates/umbrawg-transport" }
umbrawg-tun = { path = "crates/umbrawg-tun" }
umbrawg-uapi = { path = "crates/umbrawg-uapi" }

thiserror = "2"
log = "0.4"
env_logger = "0.11"
zeroize = { version = "1", features = ["zeroize_derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

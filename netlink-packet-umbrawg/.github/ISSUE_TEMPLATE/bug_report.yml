name: Сообщение об ошибке
description: Сообщить об ошибке в крейте
title: "[bug]: "
labels: ["bug"]
body:
  - type: input
    id: crate_version
    attributes:
      label: Версия крейта
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: genl_version
    attributes:
      label: Версия genl / ядро
      description: Ядро и версия generic netlink
      placeholder: "Linux 6.x, genl 1.x"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи / вывод
      render: shell

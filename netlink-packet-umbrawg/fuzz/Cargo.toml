[package]
name = "netlink-packet-umbrawg-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
netlink-packet-core = "0.8.0"
netlink-packet-generic = "0.4.0"
netlink-packet-umbrawg = { path = ".." }

[[bin]]
name = "parse_message"
path = "fuzz_targets/parse_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_range"
path = "fuzz_targets/parse_range.rs"
test = false
doc = false
bench = false
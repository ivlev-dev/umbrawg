[package]
name = "netlink-packet-umbrawg"
version = "0.3.0"
edition = "2021"
homepage = "https://github.com/ivlev-dev/netlink-packet-umbrawg"
repository = "https://github.com/ivlev-dev/netlink-packet-umbrawg"
keywords = ["wireguard", "netlink", "linux", "umbra"]
license = "MIT"
readme = "README.md"
description = "Umbra WireGuard generic netlink packet definitions"

[dependencies]
libc = "0.2.98"
log = "0.4.14"
netlink-packet-generic = { version = "0.4.0" }
netlink-packet-core = { version = "0.8.0" }

[dev-dependencies]
base64 = "0.13.0"
env_logger = "0.10.0"
futures = "0.3.16"
getrandom = "0.2.10"
pretty_assertions = "0.7.2"
proptest = "1.12.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
netlink-proto = { version = "0.12" }
genetlink = { version = "0.2.6" }
tokio = { version = "1.9.0", features = ["macros", "rt-multi-thread"] }

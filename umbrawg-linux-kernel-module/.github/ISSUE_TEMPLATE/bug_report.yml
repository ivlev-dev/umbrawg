name: Сообщение об ошибке
description: Сообщить об ошибке в модуле UmbraWG
title: "[bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Версия / коммит
      description: Версия модуля или хэш коммита
      placeholder: "1.0.0 / abc1234"
    validations:
      required: true
  - type: input
    id: kernel
    attributes:
      label: Ядро / ОС
      description: Вывод uname -a
      placeholder: "Linux 6.x ... x86_64"
    validations:
      required: true
  - type: textarea
    id: modinfo
    attributes:
      label: Вывод modinfo umbrawg
      description: Полный вывод команды
      render: shell
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Минимальная последовательность действий
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи
      description: dmesg / journalctl
      render: shell

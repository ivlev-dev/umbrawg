[workspace]
resolver = "2"
members = [
    "crates/umbrawg-config",
    "crates/umbrawg-ctl",
    "crates/uwg",
    "crates/uwg-quick",
]

[workspace.package]
version = "0.5.1"
edition = "2021"
rust-version = "1.85"
license = "GPL-2.0-only"
repository = "https://github.com/ivlev-dev/umbrawg/tree/master/umbrawg-tools"

[workspace.dependencies]
umbrawg-config = { version = "0.5.1", path = "crates/umbrawg-config" }
umbrawg-ctl = { version = "0.5.1", path = "crates/umbrawg-ctl" }
netlink-packet-umbrawg = { version = "0.5.1", path = "../netlink-packet-umbrawg" }
netlink-packet-generic = "0.4"
netlink-packet-core = "0.8"
netlink-proto = "0.12"
genetlink = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
zeroize = { version = "1", features = ["zeroize_derive"] }
base64 = "0.22"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

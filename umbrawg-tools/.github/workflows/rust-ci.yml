name: Rust CI

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout umbrawg-tools
        uses: actions/checkout@v4
        with:
          path: tools

      - name: Checkout netlink-packet-umbrawg
        uses: actions/checkout@v4
        with:
          repository: ivlev-dev/netlink-packet-umbrawg
          path: netlink-packet-umbrawg

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: tools/Cargo.toml
          command: check
          arguments: --all-features

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - name: Checkout umbrawg-tools
        uses: actions/checkout@v4
        with:
          path: tools

      - name: Checkout netlink-packet-umbrawg
        uses: actions/checkout@v4
        with:
          repository: ivlev-dev/netlink-packet-umbrawg
          path: netlink-packet-umbrawg

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - name: Checkout umbrawg-tools
        uses: actions/checkout@v4
        with:
          path: tools

      - name: Checkout netlink-packet-umbrawg
        uses: actions/checkout@v4
        with:
          repository: ivlev-dev/netlink-packet-umbrawg
          path: netlink-packet-umbrawg

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools -> tools/target

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - name: Checkout umbrawg-tools
        uses: actions/checkout@v4
        with:
          path: tools

      - name: Checkout netlink-packet-umbrawg
        uses: actions/checkout@v4
        with:
          repository: ivlev-dev/netlink-packet-umbrawg
          path: netlink-packet-umbrawg

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools -> tools/target

      - name: Run tests
        run: cargo test --workspace

  bench:
    name: bench tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - name: Checkout umbrawg-tools
        uses: actions/checkout@v4
        with:
          path: tools

      - name: Check bench scripts
        run: |
          set -euo pipefail
          bash -n bench/bench.sh bench/bench-lib.sh bench/tests/test-bench-lib.sh
          bash bench/tests/test-bench-lib.sh
          python3 -m unittest discover -s bench/tests -p 'test_*.py'

  e2e-daemon:
    name: e2e daemon (UAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - name: Checkout umbrawg-tools
        uses: actions/checkout@v4
        with:
          path: tools

      - name: Checkout netlink-packet-umbrawg
        uses: actions/checkout@v4
        with:
          repository: ivlev-dev/netlink-packet-umbrawg
          path: netlink-packet-umbrawg

      - name: Checkout umbrawg-rs
        uses: actions/checkout@v4
        with:
          repository: ivlev-dev/umbrawg-rs
          path: rust
        continue-on-error: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools -> tools/target

      - name: Build uwg
        run: cargo build --release -p uwg

      - name: Build umbrawg daemon
        working-directory: rust
        continue-on-error: true
        run: cargo build --release -p umbrawg

      - name: Check script syntax
        run: bash -n scripts/test-daemon-e2e.sh

      - name: Run e2e against the userspace daemon
        run: |
          set -euo pipefail
          if [ ! -x ../rust/target/release/umbrawg ]; then
            echo "SKIP: umbrawg daemon is not built"
            exit 0
          fi
          if ! grep -rq "advanced_security" ../rust/crates/umbrawg-uapi/src/ 2>/dev/null; then
            echo "SKIP: daemon UAPI does not support AdvancedSecurity yet"
            exit 0
          fi
          sudo -E env \
            DAEMON="$PWD/../rust/target/release/umbrawg" \
            UWG="$PWD/target/release/uwg" \
            scripts/test-daemon-e2e.sh

  packaging:
    name: packaging
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - name: Checkout umbrawg-tools
        uses: actions/checkout@v4
        with:
          path: tools

      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y groff-base fish python3-yaml python3-debian

      - name: Check packaging
        run: scripts/check-packaging.sh

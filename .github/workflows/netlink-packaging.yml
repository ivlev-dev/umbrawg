name: netlink packaging

on:
  push:
    tags:
      - "netlink-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Ожидаемая версия без префикса netlink-v (пусто — взять из Cargo.toml)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: netlink-packaging-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  TAG_PREFIX: netlink-v

defaults:
  run:
    working-directory: netlink-packet-umbrawg

jobs:
  meta:
    name: версия
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout netlink-packet-umbrawg
        uses: actions/checkout@v4

      - name: Определить версию
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ -z "$version" ]; then
            echo "error: не удалось определить версию крейта из netlink-packet-umbrawg/Cargo.toml" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "push" ]; then
            expected="${TAG_PREFIX}${version}"
            if [ "$REF_NAME" != "$expected" ]; then
              echo "error: тег $REF_NAME не совпадает с версией $version (ожидался $expected)" >&2
              exit 1
            fi
          elif [ -n "${REQUESTED:-}" ] && [ "$REQUESTED" != "$version" ]; then
            echo "error: запрошена версия $REQUESTED, в Cargo.toml $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: тесты
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout netlink-packet-umbrawg
        uses: actions/checkout@v4

      - name: Установить Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: netlink-packet-umbrawg -> netlink-packet-umbrawg/target

      - name: Прогнать тесты
        run: cargo test --all-targets

  arch:
    name: arch
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: archlinux:latest
    steps:
      - name: Установить зависимости
        working-directory: .
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed base-devel cargo git rust
          useradd -m builder

      - name: Checkout netlink-packet-umbrawg
        uses: actions/checkout@v4

      - name: Передать каталог упаковки пользователю сборки
        working-directory: netlink-packet-umbrawg/contrib/arch
        run: |
          set -euo pipefail
          chown -R builder:builder .

      - name: Собрать rust-netlink-packet-umbrawg-git
        working-directory: netlink-packet-umbrawg/contrib/arch/rust-netlink-packet-umbrawg-git
        run: |
          set -euo pipefail
          pkgdir="$PWD"
          su builder -c "cd '$pkgdir' && makepkg -f --noconfirm --nodeps"

      - name: Проверить версию собранного -git пакета
        working-directory: netlink-packet-umbrawg/contrib/arch/rust-netlink-packet-umbrawg-git
        env:
          EXPECTED: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkg=""
          for candidate in ./*.pkg.tar.zst; do
            name="$(basename "$candidate")"
            case "$name" in
              "rust-netlink-packet-umbrawg-git-${EXPECTED}.r"*) pkg="$name"; break ;;
            esac
          done
          if [ -z "$pkg" ]; then
            echo "error: нет пакета rust-netlink-packet-umbrawg-git-${EXPECTED}.r* среди *.pkg.tar.zst" >&2
            echo "error: ветка, которую клонирует PKGBUILD, не совпадает с версией сборки" >&2
            exit 1
          fi

      - name: Проверить содержимое пакета
        working-directory: netlink-packet-umbrawg/contrib/arch/rust-netlink-packet-umbrawg-git
        env:
          EXPECTED: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(./*.pkg.tar.zst)
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "error: не найден собранный пакет" >&2
            exit 1
          fi
          pkg="${pkgs[0]}"
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg
          bsdtar -xpf "$pkg" -C /tmp/pkg
          registry="/tmp/pkg/usr/share/cargo/registry/netlink-packet-umbrawg-${EXPECTED}"
          test -d "$registry"
          test -f "$registry/Cargo.toml"
          test -f "$registry/LICENSE"
          test -f "$registry/.cargo-checksum.json"
          shopt -s nullglob
          sources=("$registry"/src/*.rs)
          test "${#sources[@]}" -gt 0
          test -f "/tmp/pkg/usr/share/licenses/rust-netlink-packet-umbrawg-git/LICENSE"
          cat "$registry/.cargo-checksum.json"

      - name: Проверить офлайновую сборку потребителя из упакованного крейта
        working-directory: netlink-packet-umbrawg/contrib/arch/rust-netlink-packet-umbrawg-git
        env:
          EXPECTED: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          minor="${EXPECTED%.*}"
          rm -rf /tmp/registry /tmp/consumer /tmp/vendor
          mkdir -p /tmp/registry /tmp/consumer/src
          cp -a "/tmp/pkg/usr/share/cargo/registry/netlink-packet-umbrawg-${EXPECTED}"/. /tmp/registry/
          cat > /tmp/consumer/Cargo.toml <<EOF
          [package]
          name = "packaged-crate-consumer"
          version = "0.0.0"
          edition = "2021"
          publish = false

          [dependencies]
          netlink-packet-umbrawg = "${minor}"

          [patch.crates-io]
          netlink-packet-umbrawg = { path = "/tmp/registry" }
          EOF
          cat > /tmp/consumer/src/main.rs <<'EOF'
          fn main() {
              assert_eq!(netlink_packet_umbrawg::constants::UWG_CMD_GET_DEVICE, 0);
          }
          EOF
          cd /tmp/consumer
          cargo vendor --versioned-dirs /tmp/vendor >/dev/null
          cp -a /tmp/registry "/tmp/vendor/netlink-packet-umbrawg-${EXPECTED}"
          sed -i '/^\[patch.crates-io\]/,$d' Cargo.toml
          mkdir -p .cargo
          cat > .cargo/config.toml <<EOF
          [source.crates-io]
          replace-with = "packaged"

          [source.packaged]
          directory = "/tmp/vendor"
          EOF
          cargo build --offline
          ./target/debug/packaged-crate-consumer

      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: netlink-packet-umbrawg-arch
          path: netlink-packet-umbrawg/contrib/arch/rust-netlink-packet-umbrawg-git/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

  crate:
    name: crate
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout netlink-packet-umbrawg
        uses: actions/checkout@v4

      - name: Установить Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: netlink-packet-umbrawg -> netlink-packet-umbrawg/target

      - name: Собрать .crate
        run: cargo package --locked

      - name: Проверить, что .crate не пустой
        run: |
          set -euo pipefail
          shopt -s nullglob
          crates=(target/package/*.crate)
          if [ "${#crates[@]}" -ne 1 ]; then
            echo "error: ожидался ровно один .crate, найдено ${#crates[@]}" >&2
            exit 1
          fi
          tar -tzf "${crates[0]}" | sed -n '1,50p'

      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: netlink-packet-umbrawg-crate
          path: netlink-packet-umbrawg/target/package/*.crate
          if-no-files-found: error
          retention-days: 14

  publish-dry-run:
    name: publish dry-run
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout netlink-packet-umbrawg
        uses: actions/checkout@v4

      - name: Установить Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: netlink-packet-umbrawg -> netlink-packet-umbrawg/target

      - name: Проверить пакетирование без публикации
        run: cargo publish --dry-run --locked

  release:
    name: релиз
    needs:
      - meta
      - test
      - arch
      - crate
    if: startsWith(github.ref, 'refs/tags/netlink-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Скачать артефакты
        uses: actions/download-artifact@v4
        with:
          pattern: netlink-packet-umbrawg-*
          path: dist
          merge-multiple: true

      - name: Посчитать SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(./*.pkg.tar.zst ./*.crate)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "error: нечего публиковать" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.pkg.tar.zst
            dist/*.crate
            dist/SHA256SUMS
          fail_on_unmatched_files: true


name: rs CI

on:
  push:
    branches:
      - master
    tags:
      - "rs-v*"
    paths:
      - "umbrawg-rs/**"
  pull_request:
    paths:
      - "umbrawg-rs/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: rs-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: umbrawg-rs/Cargo.toml
          command: check
          arguments: --all-features

  test:
    name: test stable
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: umbrawg-rs
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: umbrawg-rs -> umbrawg-rs/target

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

  msrv:
    name: msrv 1.88
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: umbrawg-rs
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: umbrawg-rs -> umbrawg-rs/target
          key: msrv

      - run: cargo build --workspace --locked
      - run: cargo test --workspace --no-run --locked

  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            packages: ""
            machine: X86-64
            qemu: ""
            sysroot: ""
          - target: aarch64-unknown-linux-gnu
            packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross libc6-arm64-cross qemu-user-static
            machine: AArch64
            qemu: qemu-aarch64-static
            sysroot: /usr/aarch64-linux-gnu
          - target: armv7-unknown-linux-gnueabihf
            packages: gcc-arm-linux-gnueabihf libc6-dev-armhf-cross libc6-armhf-cross qemu-user-static
            machine: ARM
            qemu: qemu-arm-static
            sysroot: /usr/arm-linux-gnueabihf
    defaults:
      run:
        working-directory: umbrawg-rs
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: umbrawg-rs -> umbrawg-rs/target
          key: ${{ matrix.target }}

      - name: Install cross toolchain
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}

      - name: Configure cross linker
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
              ;;
            armv7-unknown-linux-gnueabihf)
              echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> "$GITHUB_ENV"
              ;;
            *)
              echo "native target: ${{ matrix.target }}"
              ;;
          esac

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}" -p umbrawg

      - name: Compile tests for target
        run: cargo test --workspace --no-run --locked --target "${{ matrix.target }}"

      - name: Verify ELF architecture
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/umbrawg"
          file "$binary"
          readelf -h "$binary" | grep -E "Class|Machine|Type"
          readelf -d "$binary" | grep -E "NEEDED|RPATH|RUNPATH" || true
          readelf -V "$binary" | grep -o "GLIBC_[0-9.]*" | sort -u -V | tail -1 || true
          machine="$(readelf -h "$binary" | awk -F: '/Machine:/ { gsub(/^[ \t]+/, "", $2); print $2 }')"
          expected="${{ matrix.machine }}"
          case "$machine" in
            *"$expected"*) ;;
            *)
              echo "unexpected machine: $machine (expected $expected)" >&2
              exit 1
              ;;
          esac

      - name: Run cross binary under qemu
        if: matrix.qemu != ''
        run: "${{ matrix.qemu }} -L ${{ matrix.sysroot }} target/${{ matrix.target }}/release/umbrawg --version"

      - name: Run unit tests under qemu
        if: matrix.qemu != ''
        env:
          QEMU_RUNNER: ${{ matrix.qemu }} -L ${{ matrix.sysroot }}
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER="$QEMU_RUNNER"
              ;;
            armv7-unknown-linux-gnueabihf)
              export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUNNER="$QEMU_RUNNER"
              ;;
          esac
          cargo test --locked --target "${{ matrix.target }}" --lib \
            -p umbrawg-crypto -p umbrawg-proto -p umbrawg-transport -p umbrawg-tun
          cargo test --locked --target "${{ matrix.target }}" -p umbrawg-transport --test loopback

      - name: Stage release tree
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "umbrawg") | .version')"
          name="umbrawg-${version}-${{ matrix.target }}"
          root="dist/${name}"
          install -Dm755 "target/${{ matrix.target }}/release/umbrawg" "${root}/usr/bin/umbrawg"
          if [ -d systemd ]; then
            install -Dm644 systemd/*.service -t "${root}/usr/lib/systemd/system"
          fi
          install -Dm644 README.md "${root}/usr/share/doc/umbrawg/README.md"
          install -Dm644 CHANGELOG.md "${root}/usr/share/doc/umbrawg/CHANGELOG.md"
          install -Dm644 LICENSE "${root}/usr/share/doc/umbrawg/LICENSE"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          tar -tzf "dist/${name}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: umbrawg-${{ matrix.target }}
          path: umbrawg-rs/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  dataplane:
    name: data-plane e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: umbrawg-rs
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: umbrawg-rs -> umbrawg-rs/target

      - name: Build release daemon
        run: cargo build --release --locked -p umbrawg

      - name: Build uwg
        continue-on-error: true
        run: cargo build --release --locked --manifest-path ../umbrawg-tools/Cargo.toml -p uwg

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iperf3 iproute2 netcat-openbsd

      - name: Run data-plane e2e
        run: |
          sudo -E env \
            UWG="$PWD/../umbrawg-tools/target/release/uwg" \
            DAEMON="$PWD/target/release/umbrawg" \
            bash scripts/test-dataplane-e2e.sh

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/rs-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: umbrawg-*
          path: dist
          merge-multiple: true

      - name: Calculate checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true

